layer:
  type: Board
  description: Default NuMaker-X-M55M1D board I/O and media interfaces
  for-board: Nuvoton::NuMaker-X-M55M1D

  # Processor features used in this project.
  processor:
    trustzone: off

  # List connections used to identify compatible software layers.
  connections:
    - connect: NuMaker-X-M55M1D Board
      provides:
        - CMSIS_USB_Device
        - CMSIS_VIO
        - CMSIS_VSTREAM_VIDEO_IN
        - CMSIS_VSTREAM_VIDEO_OUT
        - STDIN
        - STDOUT
        - STDERR
        - Heap: 65536
      consumes:
        - CMSIS-RTOS2

  # List of #define statements passed via the command line to the build tool.
  define:
    - CMSIS_target_header: \"NuMaker-X-M55M1D.h\"

  # List the packs used in the layer.
  packs:
    - pack: Nuvoton::NuMicroM55_DFP@^3.2.0-0
    - pack: Nuvoton::NuMicro_M55M1_BSP@^3.2.0-0
    - pack: ARM::CMSIS@^6.4.0
    - pack: ARM::CMSIS-Ethos-U@^1.0.0

  # List components to use for your application.
  # A software component is a re-usable unit that may be configurable.
  components:
    - component: Board Support:Camera:NuMaker-X-M55M1D
    - component: Board Support:External RAM:NuMaker-X-M55M1D
    - component: Board Support:Graphic LCD:NuMaker-X-M55M1D

    - component: CMSIS:CORE
    - component: CMSIS Driver:VIO:Board&NuMaker-X-M55M1D
    - component: CMSIS Driver:vStream:VideoIn&NuMaker-X-M55M1D
    - component: CMSIS Driver:vStream:VideoOut&NuMaker-X-M55M1D
    - component: CMSIS Driver:USB Device:M55M1_M5531_FS
    - component: CMSIS Driver:USB Device:M55M1_M5531_HS

    - component: Device:Startup
    - component: Device:Common:M55M1_M5531
    - component: Device:StdDriver:CCAP
    - component: Device:StdDriver:CLK
    - component: Device:StdDriver:DMIC
    - component: Device:StdDriver:EBI
    - component: Device:StdDriver:GPIO
    - component: Device:StdDriver:HSUSBD
    - component: Device:StdDriver:LPPDMA
    - component: Device:StdDriver:PDMA
    - component: Device:StdDriver:PMC
    - component: Device:StdDriver:Retarget
    - component: Device:StdDriver:SYS
    - component: Device:StdDriver:SPIM
    - component: Device:StdDriver:SPIM_HYPER
    - component: Device:StdDriver:UART
    - component: Device:StdDriver:USBD

    - component: Machine Learning:NPU Support:Ethos-U Driver&Generic U55
      define:
        - ETHOSU_MACS: 256

  # List of source groups and files added to a project or a layer.
  groups:
    - group: Board
      files:
        - file: README.md
        - file: NuMaker-X-M55M1D.h
        - file: main.c
        - file: ethos_setup.c

    - group: Ethos Interface
      files:
        - file: ethosu_dcache.c
        - file: ethosu_os_rtos2.c
